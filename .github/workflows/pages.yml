name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2-rite/package-lock.json
      - name: Install and build RITE
        working-directory: v2-rite
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/rite _site/jedibo
          cp site/index.html _site/index.html
          cp v1-wow-slice/index.html _site/jedibo/index.html
          cp -a v2-rite/dist/. _site/rite/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
